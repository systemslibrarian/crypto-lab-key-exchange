name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The gate, called rather than copied. This is the same workflow the
  # Dependabot auto-merge waits on, so "what merged it" and "what publishes it"
  # are now the same definition and cannot drift apart.
  gate:
    uses: ./.github/workflows/gate.yml

  # Build only. Every gate step that used to live here -- engine tests, the
  # locked browser-runner check, the Playwright install, test:a11y and
  # test:mutations -- now runs once, in the called workflow above.
  build:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Must match ci.yml: `npm test` imports src/engine.ts directly and so
          # runs under --experimental-strip-types, which only exists from Node
          # 22.6. On Node 20 the flag is rejected outright ("node: bad option").
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    # `gate` is already transitive through `build`; naming it here as well
    # states the invariant in the one place a reader checks it.
    needs: [gate, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
